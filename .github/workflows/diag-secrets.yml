name: diag-secrets

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "GH_TOKEN length: ${#GH_TOKEN}"
          echo "GH_TOKEN last byte: $(printf '%s' "$GH_TOKEN" | tail -c 1 | od -An -tx1 | tr -d ' ')"
          echo "GH_TOKEN first 4: $(printf '%s' "$GH_TOKEN" | cut -c1-4)"
          echo "--- API /user ---"
          curl -s -o /dev/null -w "status: %{http_code}\n" -H "Authorization: token $GH_TOKEN" https://api.github.com/user
          echo "--- API private repo ---"
          curl -s -o /dev/null -w "status: %{http_code}\n" -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/7891333/new-api-android
          echo "--- API this repo ---"
          curl -s -o /dev/null -w "status: %{http_code}\n" -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/7891333/bytebloom-vps