name: setup-secrets

on:
  workflow_dispatch:
    inputs:
      PAT:
        description: GitHub PAT with repo access
        required: true
      DEMO_KEY:
        description: AES-256 key (hex)
        required: true
      EXEC_TOKEN:
        description: WSS/exec auth token
        required: true
      TUNNEL_TOKEN:
        description: Cloudflare tunnel token
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ inputs.PAT }}"
          echo "::add-mask::${{ inputs.DEMO_KEY }}"
          echo "::add-mask::${{ inputs.EXEC_TOKEN }}"
          echo "::add-mask::${{ inputs.TUNNEL_TOKEN }}"
      - name: Set repository secrets
        env:
          GH_TOKEN: ${{ inputs.PAT }}
          DEMO_KEY: ${{ inputs.DEMO_KEY }}
          EXEC_TOKEN: ${{ inputs.EXEC_TOKEN }}
          TUNNEL_TOKEN: ${{ inputs.TUNNEL_TOKEN }}
        run: |
          echo "$DEMO_KEY" | gh secret set DEMO_KEY --repo 7891333/bytebloom-vps --body -
          echo "$EXEC_TOKEN" | gh secret set EXEC_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "$TUNNEL_TOKEN" | gh secret set TUNNEL_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "$GH_TOKEN" | gh secret set GH_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "=== secrets 配置完成 ==="