name: setup-secrets

on:
  workflow_dispatch:
    inputs:
      GH_TOKEN:
        description: GitHub PAT
        required: true
      DEMO_KEY:
        description: AES-256 key (hex)
        required: true
      EXEC_TOKEN:
        description: WSS/exec auth token
        required: true
      TUNNEL_TOKEN:
        description: Cloudflare tunnel token
        required: true

permissions:
  secrets: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ github.event.inputs.GH_TOKEN }}"
          echo "::add-mask::${{ github.event.inputs.DEMO_KEY }}"
          echo "::add-mask::${{ github.event.inputs.EXEC_TOKEN }}"
          echo "::add-mask::${{ github.event.inputs.TUNNEL_TOKEN }}"
      - name: Set repository secrets
        env:
          V1: ${{ github.event.inputs.GH_TOKEN }}
          V2: ${{ github.event.inputs.DEMO_KEY }}
          V3: ${{ github.event.inputs.EXEC_TOKEN }}
          V4: ${{ github.event.inputs.TUNNEL_TOKEN }}
        run: |
          echo "$V1" | gh secret set GH_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "$V2" | gh secret set DEMO_KEY --repo 7891333/bytebloom-vps --body -
          echo "$V3" | gh secret set EXEC_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "$V4" | gh secret set TUNNEL_TOKEN --repo 7891333/bytebloom-vps --body -
          echo "=== secrets 配置完成 ==="